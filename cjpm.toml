[package]
  cjc-version = "1.1.3"
  name = "admin"
  organization = ""
  description = "nothing here"
  version = "1.0.0"
  target-dir = ""
  script-dir = ""
  output-type = "executable"
  compile-option = "-lcangjie-dynamicLoader-opensslFFI"
  override-compile-option = ""
  link-option = ""
  package-configuration = {}

[dependencies]
  "sqlsharp" = "1.0.20260831"
  "soulsoft_web_mvc" = "1.0.20260831"
  "soulsoft_web_cors" = "1.0.20260831"
  "soulsoft_web_http" = "1.0.20260831"
  "soulsoft_mediator" = "1.0.20260831"
  "soulsoft_serialization" = "1.0.20260831"
  "soulsoft_web_routing" = "1.0.20260831"
  "soulsoft_web_hosting" = "1.0.20260831"
  "soulsoft_web_openapi" = "1.0.20260831"
  "soulsoft_web_staticfiles" = "1.0.20260831"
  "soulsoft_web_healthchecks" = "1.0.20260831"
  "soulsoft_web_authorization" = "1.0.20260831"
  "soulsoft_web_authentication" = "1.0.20260831"
  "soulsoft_extensions_http" = "1.0.20260831"
  "soulsoft_extensions_logging" = "1.0.20260831"
  "soulsoft_extensions_options" = "1.0.20260831"
  "soulsoft_identity_claims" = "1.0.20260831"
  "soulsoft_identity_tokens" = "1.0.20260831"
  "soulsoft_identity_tokens_jwt" = "1.0.20260831"
  "soulsoft_extensions_sqlsharp" = "1.0.20260831"
  "soulsoft_extensions_injection" = "1.0.20260831"
  "soulsoft_extensions_healthchecks" = "1.0.20260831"
  "soulsoft_extensions_configuration" = "1.0.20260831"
  "soulsoft_web_authentication_jwtbearer" = "1.0.20260831"

[target]
  [target.x86_64-w64-mingw32]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -lcrypt32"
    [target.x86_64-w64-mingw32.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.x86_64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl"
    [target.x86_64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  [target.aarch64-unknown-linux-gnu]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated -ldl"
    [target.aarch64-unknown-linux-gnu.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
  # ---- 教程没有的这一块，macOS 开发机专用 ----
  # 不加 -ldl：macOS 的 dlopen/dlsym 在 libSystem 里，没有独立的 libdl
  [target.aarch64-apple-darwin]
    compile-option = "-Woff unused --diagnostic-format=noColor -Woff deprecated"
    [target.aarch64-apple-darwin.bin-dependencies]
      path-option = [ "${CANGJIE_STDX_PATH}" ]
